<section class="sync-card" aria-labelledby="sync-title">
  <h3 id="sync-title"><mat-icon class="ic-cloud_sync" aria-hidden="true">cloud_sync</mat-icon> {{ 'weather.syncTitle' | t }}</h3>
  <p class="muted">{{ 'weather.syncHelp' | t }}</p>
  <form [formGroup]="form" (ngSubmit)="sync()" class="sync-form" novalidate>
    <mat-form-field appearance="outline">
      <mat-label>{{ 'weather.company' | t }}</mat-label>
      <mat-select formControlName="businessEntityId" required>
        @for (b of businesses(); track b.idBusinessEntity) {
          <mat-option [value]="b.idBusinessEntity">{{ b.name }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>{{ 'weather.latitude' | t }}</mat-label>
      <input matInput type="number" step="0.0001" formControlName="latitude" required />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>{{ 'weather.longitude' | t }}</mat-label>
      <input matInput type="number" step="0.0001" formControlName="longitude" required />
    </mat-form-field>
    <button mat-flat-button type="submit" [disabled]="busy()">
      <mat-icon>sync</mat-icon> {{ 'weather.sync' | t }}
    </button>
  </form>
  @if (busy()) {
    <mat-progress-bar mode="indeterminate" [attr.aria-label]="'common.loading' | t"></mat-progress-bar>
  }
  @if (message()) {
    <p class="msg-error" role="alert">{{ message() }}</p>
  }
</section>
