<div class="container">
  <h2>Lista de Plagas</h2>
  <div class="cabecera">
    <a mat-flat-button class="btn-registrar" routerLink="/plagas/insertar">
      <mat-icon>add</mat-icon> Registrar
    </a>
  </div>
  <p>{{ mensaje }}</p>
  <div>
    @if(dataSource.length>0){
    <table mat-table [dataSource]="dataSource" class="mat-shadow-2">
      <ng-container matColumnDef="C1">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let element">{{ element.idPestType }}</td>
      </ng-container>
      <ng-container matColumnDef="C2">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let element">{{ element.name }}</td>
      </ng-container>
      <ng-container matColumnDef="C3">
        <th mat-header-cell *matHeaderCellDef>Nivel de riesgo</th>
        <td mat-cell *matCellDef="let element">{{ element.riskLevel }}</td>
      </ng-container>
      <ng-container matColumnDef="C4">
        <th mat-header-cell *matHeaderCellDef>Descripción</th>
        <td mat-cell *matCellDef="let element">{{ element.description }}</td>
      </ng-container>
      <ng-container matColumnDef="C5">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let element">
          <a mat-icon-button class="btn-ver" [routerLink]="['/plagas/ver', element.idPestType]" title="Ver">
            <mat-icon>visibility</mat-icon>
          </a>
          <a mat-icon-button class="btn-editar" [routerLink]="['/plagas/editar', element.idPestType]" title="Editar">
            <mat-icon>edit</mat-icon>
          </a>
          <button mat-icon-button class="btn-eliminar" (click)="eliminarPlaga(element.idPestType)" title="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
    }@else {
    <p>No hay registros disponibles.</p>
    }
  </div>
</div>
