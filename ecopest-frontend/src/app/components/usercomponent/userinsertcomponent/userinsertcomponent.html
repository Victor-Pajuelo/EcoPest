<div class="container">
  <div>
    <h2>Registro de Usuario</h2>
  </div>
  <div>
    <form [formGroup]="form" (ngSubmit)="insertarUsuario()">
      <mat-form-field class="example-full-width">
        <mat-label>Nombre</mat-label>
        <input matInput type="text" formControlName="name">
      </mat-form-field>
      <br>
      <mat-form-field class="example-full-width">
        <mat-label>Correo electrónico</mat-label>
        <input matInput type="email" formControlName="email">
      </mat-form-field>
      <br>
      <mat-form-field class="example-full-width">
        <mat-label>Contraseña</mat-label>
        <input matInput type="password" formControlName="password">
      </mat-form-field>
      <br>
      <mat-form-field>
        <mat-label>Rol</mat-label>
        <mat-select formControlName="roleId">
          @for (o of roles; track o.idRole) {
          <mat-option [value]="o.idRole">{{ o.name }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
      <br>
      <mat-form-field>
        <mat-label>Empresa</mat-label>
        <mat-select formControlName="businessEntityId">
          @for (o of empresas; track o.idBusinessEntity) {
          <mat-option [value]="o.idBusinessEntity">{{ o.name }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
      <br>
      <section class="example-section">
        <mat-checkbox class="example-margin" formControlName="active">Activo</mat-checkbox>
      </section>

      <button matButton type="submit">Registrar</button>
    </form>
    <p>{{ mensaje }}</p>
  </div>
</div>
