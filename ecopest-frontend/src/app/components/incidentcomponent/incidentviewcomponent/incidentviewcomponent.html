<div class="container">
  <h2><mat-icon>visibility</mat-icon> Detalle del incidente</h2>
  <p>{{ mensaje }}</p>
  <div class="perfil">
    <div class="avatar"><mat-icon>warning</mat-icon></div>
    <div class="dato"><span>ID</span><strong>{{ incidente.idIncident }}</strong></div>
    <div class="dato"><span>Fecha</span><strong>{{ incidente.incidentDate }}</strong></div>
    <div class="dato"><span>Descripción</span><strong>{{ incidente.description }}</strong></div>
    <div class="dato"><span>Estado</span><strong>{{ incidente.status }}</strong></div>
    <div class="dato"><span>Plaga</span><strong>{{ plaga || '-' }}</strong></div>
    <div class="dato"><span>Inspección</span><strong>{{ inspeccion || '-' }}</strong></div>
  </div>
  <a mat-flat-button class="btn-volver" routerLink="/incidentes/listar">
    <mat-icon>arrow_back</mat-icon> Volver
  </a>
</div>
