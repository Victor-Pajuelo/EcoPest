<div class="container">
  <div>
    <h2>Actualizar Clima</h2>
  </div>
  <div>
    <form [formGroup]="form" (ngSubmit)="actualizarClima()">
      <mat-form-field>
        <mat-label>Fecha</mat-label>
        <input matInput [matDatepicker]="picker_date" formControlName="date">
        <mat-hint>MM/DD/YYYY</mat-hint>
        <mat-datepicker-toggle matIconSuffix [for]="picker_date"></mat-datepicker-toggle>
        <mat-datepicker #picker_date></mat-datepicker>
      </mat-form-field>
      <br>
      <mat-form-field class="example-full-width">
        <mat-label>Temperatura (°C)</mat-label>
        <input matInput type="number" step="0.1" formControlName="temperature">
      </mat-form-field>
      <br>
      <mat-form-field class="example-full-width">
        <mat-label>Humedad (%)</mat-label>
        <input matInput type="number" step="0.1" formControlName="humidity">
      </mat-form-field>
      <br>
      <mat-form-field class="example-full-width">
        <mat-label>Fuente</mat-label>
        <input matInput type="text" formControlName="source">
      </mat-form-field>
      <br>
      <mat-form-field>
        <mat-label>Empresa</mat-label>
        <mat-select formControlName="businessEntityId">
          @for (o of empresas; track o.idBusinessEntity) {
          <mat-option [value]="o.idBusinessEntity">{{ o.name }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
      <br>

      <button matButton type="submit">Actualizar</button>
    </form>
    <p>{{ mensaje }}</p>
  </div>
</div>
