# Perfil de pruebas: base H2 en memoria para no depender de Postgres
spring.datasource.url=jdbc:h2:mem:ecopest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database=h2
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
jwt.secret=clave-solo-para-pruebas-clave-solo-para-pruebas-clave-solo-para-pruebas-123456
