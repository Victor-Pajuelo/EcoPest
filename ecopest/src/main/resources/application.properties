spring.application.name=ecopest

spring.jpa.database=postgresql
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost/BDEcoPest
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:123}

# JWT signing secret. Must be set as an environment variable (no default on
# purpose) - never commit a real secret here. Generate one with:
#   openssl rand -hex 64
jwt.secret=${JWT_SECRET}
