spring.application.name=ecopest

spring.jpa.database=postgresql
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost/BDEcoPest}
spring.datasource.username=${DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123}

# JWT signing secret. Must be set as an environment variable (no default on
# purpose) - never commit a real secret here. Generate one with:
#   openssl rand -hex 64
jwt.secret=${JWT_SECRET}

# CORS: origenes del frontend permitidos (separados por coma)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# API externa de IA (Gemini). La clave NO se guarda en el codigo: usar la variable de entorno.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
